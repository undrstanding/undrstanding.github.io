<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@900&family=JetBrains+Mono&display=swap');

        :root {
            --galaxy-deep: #050505;
            --galaxy-nebula: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--galaxy-deep);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .galaxy-container {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, var(--galaxy-nebula) 0%, var(--galaxy-deep) 100%);
            z-index: -1;
        }

        .content-wrapper {
            max-width: 600px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(5rem, 15vw, 10rem);
            line-height: 0.8;
            margin-bottom: 2rem;
            letter-spacing: -5px;
            opacity: 0.9;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            color: #000;
            padding: 0.8rem 2.2rem;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
    </style>

    <script>
        // REDIRECT LOGIC
        // Added a 3-second delay so the preview renders properly
        window.onload = () => {
            setTimeout(() => {
                const newDomain = "https://undrstanding.com";
                window.location.href = newDomain + window.location.pathname;
            }, 3000);
        };
    </script>
</head>

<body>
    <div class="galaxy-container"></div>

    <div class="content-wrapper">
        <h1 class="error-code">404</h1>
        <h2 class="text-2xl font-bold mb-4">Moving to a new home...</h2>
        <p class="mb-8 text-gray-400">You are being redirected to our new domain: undrstanding.com in 3 seconds.</p>
        <a href="https://undrstanding.com" class="home-btn">
            Go to undrstanding.com now
        </a>
    </div>
</body>

</html>
